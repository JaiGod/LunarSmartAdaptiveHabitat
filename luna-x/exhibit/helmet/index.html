<script>window.EXHIBIT={"id": "helmet", "no": "01", "category": "Crew Health · EVA Systems", "accent": "#5AB8FF", "title": "LUNA-X Adaptive Cognitive Helmet", "short": "Cognitive Helmet", "titleHTML": "ADAPTIVE<br>COGNITIVE HELMET", "kicker": "NASA HUNCH · Project ARES · LUNA-X Exhibit 01", "tagline": "A second set of eyes on every mission", "model": "../models/helmet.glb", "fit": 1.3, "exposure": 0.85, "bloom": 0.35, "desc": "The LUNA-X Adaptive Cognitive Helmet is an EVA and habitat helmet with a built-in AI. It watches the astronaut's eyes, breathing and surroundings, warns gently before small problems become big ones, and calls the crew automatically if something goes wrong.", "q5": {"what": "A smart helmet with eye-tracking cameras, environmental sensor pods, an adaptive lighting ring, a heads-up display and a rear LUNA AI core.", "why": "Tired, stressed or injured astronauts are often the last to notice it themselves. On the Moon there is no ambulance and Earth is 1.3 light-seconds away.", "how": "Inner cameras read blink rate and focus, outer pods read dust, air, radiation and terrain, and the rear AI core turns it all into a fatigue and risk score shown on the HUD and the light ring.", "problem": "Long shifts, radiation events, sharp regolith dust and dark craters. The helmet spots fatigue early, closes the visor during radiation alerts and lights the way in darkness.", "connect": "Streams crew wellness to the habitat LUNA AI, relays comms, triggers O2 refill or sleep reminders, and tells the habitat lights to warm up when the crew is worn out."}, "hub": {"match": "AI_Core", "label": "LUNA AI core", "hint": "CLICK TO SCAN", "button": "Run cognitive scan", "face": [0, 0, -1]}, "glow": {"cycle": "Lighting_Ring|Ring_|HUD", "beat": "Status|EyeTrack_IR|Beacon"}, "holo": [{"l": "FATIGUE", "v": 18, "j": 3, "u": "%"}, {"l": "BLINK RATE", "v": 16, "j": 2, "u": "/MIN"}, {"l": "CO2", "v": 0.4, "j": 0.05, "d": 2, "u": "%"}, {"l": "RADIATION", "t": "NORMAL", "ok": 1}], "parts": [{"k": "visor", "label": "Smart-glass visor", "sub": "Cognitive load HUD", "match": "Visor_Clear|HUD_", "what": "The clear smart-glass visor carries a small fighter-pilot-style HUD: O2, stress, recovery score and LUNA messages.", "why": "Astronauts cannot look down at a tablet in gloves. Key numbers have to sit where their eyes already are.", "how": "Projected overlays stay at the edge of vision; the AI only promotes a message to the centre when it matters.", "problem": "Information overload during busy EVAs. Only what matters right now is shown.", "connect": "Pulls O2 and CO2 from the suit, schedules from habitat ops and wellness scores from LUNA.", "links": ["health", "life", "ops"], "metrics": [["5", "HUD channels"], ["<0.2 s", "alert latency"]]}, {"k": "eyes", "label": "Eye-tracking cameras", "sub": "Blink · focus · fatigue", "match": "EyeTrack", "what": "Two inner IR cameras watch the astronaut's eyes.", "why": "Blink rate and slow eye movements are among the earliest signs of fatigue.", "how": "IR LEDs light the eyes invisibly; the cameras track blink duration and gaze and feed the fatigue model.", "problem": "Microsleeps and attention lapses during repetitive tasks far from help.", "connect": "Fatigue scores go to the LUNA wellness log and drive sleep-readiness suggestions.", "links": ["health", "sleep"], "metrics": [["2", "IR cameras"], ["60 Hz", "tracking"]]}, {"k": "sensors", "label": "Environmental sensor pods", "sub": "Dust · air · radiation · IR", "match": "Sensor_(Dust|Air|Radiation|Surface)", "what": "Four sensor pods on the shell: dust detector, air quality, radiation and surface-temperature IR.", "why": "The astronaut needs to know about invisible hazards before they feel them.", "how": "Pods extend to sample, then retract; readings fuse into one environment status on the HUD.", "problem": "Lunar dust, solar particle events and extreme surface temperatures.", "connect": "Feeds the habitat environmental map and the storm-shelter alert system.", "links": ["life", "science", "eva"], "metrics": [["4", "sensor pods"], ["1 Hz", "sample rate"]]}, {"k": "lidar", "label": "LiDAR obstacle sensor", "sub": "Terrain + obstacles", "match": "Sensor_LiDAR", "what": "A forward LiDAR window at the brow scans for obstacles and terrain edges.", "why": "Shadows on the Moon are pitch black and depth is hard to judge.", "how": "A scanning laser builds a depth map; edges and rocks are flagged on the HUD.", "problem": "Trips and falls near crater rims and in permanent shadow.", "connect": "Shares terrain data with rover routing and the boot's path lighting.", "links": ["eva", "science"]}, {"k": "ring", "label": "Adaptive lighting ring", "sub": "Colour = meaning", "match": "Lighting_Ring", "what": "Thin light strips around the helmet with travelling pulses.", "why": "Crewmates need to read each other's status at a glance, even across a crater.", "how": "Purple = crew meeting, blue = O2, pink = sleep readiness, orange = recovery, red = emergency.", "problem": "Radio chatter fatigue and missed messages. Light says it silently.", "connect": "Synced with habitat lighting so the whole base speaks the same colour language.", "links": ["ops", "comms", "sleep"], "metrics": [["9", "colour states"]]}, {"k": "core", "label": "LUNA AI core", "sub": "Rear processor + fall sensor", "match": "AI_Core", "what": "The rear AI processor housing with heat sink, cooling vents and an IMU fall detector.", "why": "Decisions have to be made on the helmet itself; a round trip to Earth is too slow.", "how": "The vents open under AI load; the IMU detects falls and impacts and triggers an automatic crew call.", "problem": "An astronaut alone and unconscious after a fall.", "connect": "Syncs with the habitat LUNA server whenever in range; falls trigger a habitat-wide alert.", "links": ["health", "power", "comms"], "metrics": [["6", "cooling vents"], ["<1 s", "fall alert"]]}, {"k": "audio", "label": "Directional audio + mics", "sub": "Comms pods", "match": "Audio_Pod|Voice_Mic", "what": "Audio pods by each ear and twin voice mics.", "why": "Clear voice is a lifeline during EVA.", "how": "Directional speakers tell you which side a crewmate is calling from.", "problem": "Confusion on a busy radio loop.", "connect": "Talks through the habitat comms relay and the suit's S-band link.", "links": ["comms"]}, {"k": "antenna", "label": "Comms antenna", "sub": "Deploys on startup", "match": "Antenna", "what": "A small mast with a tip beacon that deploys when comms come online.", "why": "Line-of-sight radio is everything on the lunar surface.", "how": "The mast rises at power-on and the beacon pulses while linked.", "problem": "Lost signal behind ridges.", "connect": "Part of the habitat mesh network.", "links": ["comms", "ops"]}, {"k": "lamps", "label": "Headlamps", "sub": "Navigation light", "match": "Headlamp", "what": "Twin LED headlamps on the sides of the shell.", "why": "Craters and the lunar night are completely dark.", "how": "White navigation light with path-guidance mode tied to the LiDAR.", "problem": "Working in permanent shadow at the south pole.", "connect": "Coordinated with the boot path lighting.", "links": ["eva", "power"]}], "steps": [{"kick": "The helmet", "title": "Meet the Cognitive Helmet", "text": "A ceramic shell, a gold sun visor and a ring of light. Scroll and it turns so you can see every side.", "mode": "turn", "side": "l"}, {"kick": "Vision intelligence", "title": "It Watches for Fatigue", "text": "Inside the visor, two IR cameras watch blink rate and focus. Tiredness shows up in the eyes long before the astronaut notices it.", "mode": "part:eyes", "side": "r", "d": 0.9}, {"kick": "Environment", "title": "Sensors on Every Side", "text": "Dust, air quality, radiation and surface temperature. Each pod reports to one simple status on the HUD.", "mode": "part:sensors", "side": "l", "d": 1.1}, {"kick": "Systems", "title": "Nine Systems, One Helmet", "text": "Hover any label or part to see what it does. Click it for the full briefing.", "mode": "callouts", "side": "r"}, {"kick": "AI core", "title": "The LUNA AI Core", "text": "The processor lives at the back. Its vents open under load, and its fall sensor calls the crew automatically.", "mode": "hub", "side": "l", "d": 1.0}, {"kick": "Try it", "title": "Run a Cognitive Scan", "text": "Click the AI core or the button to scan the wearer. Live readings appear around the core.", "mode": "scan", "side": "r"}], "specs": [{"v": 4.8, "u": "kg", "l": "Mass (design target)", "p": 48}, {"v": 9, "u": "", "l": "Sensor + camera systems", "p": 90}, {"v": 12, "u": "W", "l": "Average power", "p": 40}, {"v": 10, "u": "h", "l": "Battery endurance", "p": 83}, {"v": 9, "u": "", "l": "Light-ring colour states", "p": 75}, {"v": 1, "pre": "<", "u": "s", "l": "Fall-to-alert time", "p": 95}], "table": [["Shell", "Ceramic composite outer shell, shock liner, carbon core"], ["Visor", "Clear smart-glass with HUD + gold sun visor"], ["Sensing", "Eye tracking (2× IR), LiDAR, dust, air, radiation, surface IR"], ["AI", "On-helmet LUNA core, fatigue + stress model, IMU fall detection"], ["Comms", "Directional audio, twin mics, deployable antenna"], ["Modes", "Startup, meeting, O2, sleep, recovery, navigation, dust storm, radiation lockdown"]], "systems": {"health": "Fatigue, stress and fall data go straight into each crew member's wellness record.", "sleep": "Pink glow and HUD reminders when eye data shows sleep debt.", "life": "Reads suit O2/CO2 and recommends refills with a blue pulse.", "comms": "Relays voice and data through the habitat mesh network.", "ops": "Uses habitat schedules for meeting reminders and mode changes.", "eva": "LiDAR terrain data and headlamps guide moonwalks.", "science": "Logs dust and radiation readings for the habitat science team.", "power": "Charges in the habitat dock overnight."}, "gallery": [["../../helmet/img/01_hero_3quarter.jpg", "Hero: ceramic shell, gold visor, light ring"], ["../../helmet/img/02_front_HUD.jpg", "HUD behind the smart glass"], ["../../helmet/img/04_side_sensors_audio.jpg", "Sensor pods and audio"], ["../../helmet/img/05_rear_AI_core.jpg", "Rear LUNA AI core"], ["../../helmet/img/07_exploded_layers.jpg", "Exploded layers"], ["../../helmet/img/living_13_radiation_lockdown.jpg", "Radiation lockdown"]], "videos": [["../../helmet/LUNA-X_Helmet_Living_AI.mp4", "Living AI animation", "../../helmet/img/poster.jpg"]], "downloads": [["../../downloads/LUNA-X_Helmet_Package.zip", "Blender file + renders (.zip)"]]};</script>
